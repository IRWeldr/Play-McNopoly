<!-- 📥 Ingestion Studio Modal (Drop Zone for Scans) -->
<div id="ingestion-modal" class="modal-backdrop">
    <div class="bg-slate-900 border border-purple-500 rounded-2xl w-full max-w-lg shadow-2xl p-6 relative">
        <button onclick="closeIngestionModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-lg">✕</button>

        <div class="flex items-center gap-3 mb-4">
            <span class="text-3xl">🥤</span>
            <div>
                <h3 class="text-lg font-bold text-purple-200">Grimace Ingestion Studio</h3>
                <p class="text-xs text-slate-400">Feed single stickers or flatbed sheets to Qwen3-VL Vision</p>
            </div>
        </div>

        <!-- Drag & Drop Zone -->
        <div id="drop-zone" class="border-2 border-dashed border-purple-600/50 hover:border-purple-400 bg-purple-950/20 hover:bg-purple-900/20 rounded-xl p-8 text-center transition-all cursor-pointer">
            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
            <div class="text-4xl mb-2">📥</div>
            <p class="text-sm font-semibold text-purple-200 mb-1">Drag and drop stamp scans or photos here</p>
            <p class="text-xs text-slate-400 mb-4">Supports PNG, JPG, WebP (Odd angles & multi-stamps supported)</p>
            <button onclick="document.getElementById('file-input').click()" class="px-4 py-2 bg-purple-700 hover:bg-purple-600 text-white text-xs font-bold rounded-lg shadow transition-all">
                Browse Files
            </button>
        </div>

        <div id="ingest-status" class="mt-4 text-xs font-mono text-center text-slate-400 hidden">
            <span class="inline-block animate-spin mr-2">🟣</span>
            <span id="ingest-status-text">Grimace is chewing through pixels...</span>
        </div>
    </div>
</div>
